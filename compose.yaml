services:
  tillbox:
    platform: linux/amd64
    build:
      context: .
      # 前端依赖里有私有包，构建时用环境变量 GITHUB_TOKEN 读包，见 docs/development.md；用发布好的镜像时整个 build 都去掉
      secrets:
        - GITHUB_TOKEN
    image: tillbox:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TILLBOX_PUBLIC_URL: "${TILLBOX_PUBLIC_URL:-http://localhost:8080}"
      TILLBOX_TRUSTED_PROXIES: "${TILLBOX_TRUSTED_PROXIES:-}"
      TZ: Asia/Shanghai
    volumes:
      - tillbox-data:/data

volumes:
  tillbox-data:

secrets:
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN
