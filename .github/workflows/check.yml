name: Check and build amd64
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tillbox
          POSTGRES_PASSWORD: tillbox-test
          POSTGRES_DB: tillbox
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tillbox"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      # pnpm 版本取 web/package.json 的 packageManager
      - uses: pnpm/action-setup@v6
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      # ruff 用 uv 装，装在 ~/.local/bin。setup-uv 不提供 v10 这样的主版本标签，要写完整版本号
      - uses: astral-sh/setup-uv@v10.3.0
        with: { enable-cache: false }
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # 下面的步骤和本机的 make ci（scripts/ci.sh）一致，改一处要同步另一处
      - run: make tools
      - run: make build
      - run: make lint vuln test check test-race
      - run: make test-pg
        env:
          TILLBOX_TEST_PG_DSN: postgres://tillbox:tillbox-test@localhost:5432/tillbox?sslmode=disable
      - uses: actions/upload-artifact@v7
        with: { name: tillbox-linux-amd64, path: bin/tillbox }
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --platform linux/amd64 --build-arg VERSION="${GITHUB_REF_NAME#v}" --build-arg REVISION="$GITHUB_SHA" -t "tillbox:$GITHUB_REF_NAME" .
      - run: docker save "tillbox:$GITHUB_REF_NAME" -o tillbox-linux-amd64.tar
      - run: sha256sum tillbox-linux-amd64.tar > tillbox-linux-amd64.tar.sha256
      - uses: actions/upload-artifact@v7
        with: { name: tillbox-image-linux-amd64, path: 'tillbox-linux-amd64.tar*' }
