name: Check and build amd64
on:
  push:
  pull_request:
  # 给已发布的版本补推镜像：gh workflow run check.yml -f tag=vx.y.z
  workflow_dispatch:
    inputs:
      tag: { description: '已有的版本标签，如 v0.3.0', required: true }
# packages: read 用来装前端依赖里的私有包 @yreidev/ui：包设置里给本仓库开了读权限，GITHUB_TOKEN 就能装
permissions:
  contents: read
  packages: read
jobs:
  check:
    # 手动补推镜像时不用再检查：标签发版时已经检查过
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tillbox
          POSTGRES_PASSWORD: tillbox-test
          POSTGRES_DB: tillbox
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tillbox"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      # pnpm 版本取 web/package.json 的 packageManager
      - uses: pnpm/action-setup@v6
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      # ruff 用 uv 装，装在 ~/.local/bin。setup-uv 不提供 v10 这样的主版本标签，要写完整版本号
      - uses: astral-sh/setup-uv@v10.3.0
        with: { enable-cache: false }
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # 下面的步骤和本机的 make ci（scripts/ci.sh）一致，改一处要同步另一处
      - run: make tools
      - run: make build
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - run: make lint vuln test check test-race
      - run: make test-pg
        env:
          TILLBOX_TEST_PG_DSN: postgres://tillbox:tillbox-test@localhost:5432/tillbox?sslmode=disable
      - uses: actions/upload-artifact@v7
        with: { name: tillbox-linux-amd64, path: bin/tillbox }
  # 版本标签检查通过后构建镜像，存成附件并推到 GHCR（ghcr.io/<所有者>/tillbox:x.y.z，最新版本另打 latest）
  image:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && needs.check.result == 'success')) }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # 取全部标签，用来判断这是不是最新版本
      - uses: actions/checkout@v7
        with: { ref: '${{ inputs.tag || github.ref }}', fetch-depth: 0 }
      # source 标签让 GHCR 把镜像关联到本仓库；GITHUB_TOKEN 作为构建密钥传进去装私有包，不留在镜像里
      - env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker build --platform linux/amd64 --secret id=GITHUB_TOKEN --build-arg VERSION="${TAG#v}" --build-arg REVISION="$(git rev-parse HEAD)" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "tillbox:$TAG" .
      - run: docker save "tillbox:$TAG" -o tillbox-linux-amd64.tar
      - run: sha256sum tillbox-linux-amd64.tar > tillbox-linux-amd64.tar.sha256
      - uses: actions/upload-artifact@v7
        with: { name: tillbox-image-linux-amd64, path: 'tillbox-linux-amd64.tar*' }
      - env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "tillbox:$TAG" "$image:${TAG#v}"
          docker push "$image:${TAG#v}"
          if [ "$(git tag -l 'v*' --sort=-v:refname | head -n 1)" = "$TAG" ]; then
            docker tag "tillbox:$TAG" "$image:latest"
            docker push "$image:latest"
          fi
