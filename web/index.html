<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f5" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- 后端返回页面时把标题和应用名换成“设置 → 站点”里的站点名 -->
    <meta name="application-name" content="Tillbox" />
    <title>Tillbox</title>
  </head>
  <body>
    <script>
      // 渲染前按保存的偏好（没有就跟随系统）设好深浅色，避免先白后黑地闪一下。和 src/lib/theme.ts 保持一致。
      ;(function () {
        var pref = ''
        try {
          pref = localStorage.getItem('tillbox-theme') || ''
        } catch (e) {}
        var mode =
          pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light'
        document.documentElement.classList.add(mode)
        document.documentElement.setAttribute('data-theme', mode)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
